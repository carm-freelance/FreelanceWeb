# Cada día copia el contenido de la hoja de Google dentro del HTML (y en datos.js),
# para que se vea aunque no se ejecute JavaScript. Si nada ha cambiado, no hace nada.
# También se puede lanzar a mano: pestaña Actions > "Copiar la hoja en la web" > Run workflow.
name: Copiar la hoja en la web

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        run: |
          npm install --prefix scripts --no-audit --no-fund
          npx --prefix scripts playwright install --with-deps chromium
      - name: Copiar la hoja en el HTML
        run: node scripts/actualizar-contenido.mjs
      - name: Guardar los cambios
        run: |
          if git diff --quiet; then echo "Sin cambios en la hoja"; exit 0; fi
          git config user.name "CARM"
          git config user.email "254164881+carm-freelance@users.noreply.github.com"
          git commit -am "Copiar el contenido de la hoja en el HTML"
          git push
